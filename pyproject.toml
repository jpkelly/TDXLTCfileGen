[project]
name = "ltcfilegen"
version = "0.1.0"
description = "Render movie files with an LTC timecode audio track and a visual timecode readout (TouchDesigner)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long renders (deselect with -m 'not slow')"]
